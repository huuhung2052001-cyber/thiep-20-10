<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f9e3ea">
<title>Món quà ngày 20/10</title>
<style>
:root{--rose:#9e4263;--gold:#bd8e53;--cream:#fffaf3}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 15%,#fffdf7 0%,#f8e5eb 53%,#e9bbcb 100%);color:#663c4b;font-family:Georgia,'Times New Roman',serif;overflow-x:hidden;display:grid;place-items:center;padding:28px 15px}
main{width:min(100%,470px);text-align:center;z-index:1;position:relative}.eyebrow{font:500 12px Arial,sans-serif;letter-spacing:.32em;color:var(--rose);margin:0 0 30px;text-transform:uppercase}
.env{width:min(82vw,305px);height:206px;margin:0 auto 24px;position:relative;cursor:pointer;border:0;background:linear-gradient(145deg,#f3afc4,#d780a4);border-radius:7px 7px 12px 12px;box-shadow:0 22px 40px #a04f7040;transition:transform .3s;display:block}.env:hover{transform:translateY(-4px)}.env:focus-visible,.music:focus-visible{outline:3px solid #97516e;outline-offset:5px}.env:before{content:"";position:absolute;inset:0;background:#fad1dd;clip-path:polygon(0 0,100% 0,50% 59%);border-radius:6px;z-index:1}.env:after{content:"❤";font-size:24px;color:#fff;position:absolute;left:50%;top:49%;transform:translate(-50%,-30%);height:49px;width:49px;background:#a5486d;display:grid;place-items:center;border-radius:50%;box-shadow:0 3px 8px #88435855;z-index:2}.envFlowers{position:absolute;top:-44px;left:0;right:0;font-size:54px;z-index:0;pointer-events:none}.hint{font:15px Arial,sans-serif;letter-spacing:.06em;color:#965074;animation:breathe 1.7s infinite}
.card{position:relative;background:linear-gradient(155deg,#fffefa,#fff6f4);border:2px solid #eac5b7;border-radius:22px;padding:35px 28px 32px;box-shadow:0 20px 55px #a2587538;isolation:isolate}.card:before{content:"";position:absolute;inset:10px;border:1px solid #dbb98b;border-radius:14px;pointer-events:none}.card[hidden],.env[hidden],.hint[hidden],.music[hidden]{display:none!important}.card.open{animation:appear 1.1s cubic-bezier(.2,.8,.2,1) both}.flowerTop{font-size:42px;letter-spacing:9px;filter:drop-shadow(0 6px 4px #c68ba633);animation:float 4s ease-in-out infinite}.dateTitle{font:13px Arial,sans-serif;letter-spacing:.24em;color:var(--gold);margin-top:22px}.num{font-weight:normal;font-size:clamp(49px,13vw,65px);line-height:1.1;color:var(--rose);margin:13px 0}.line{width:92px;height:1px;background:var(--gold);margin:21px auto}.to{font-size:15px;font-style:italic;color:#986b7a;margin:0}.name{font-weight:normal;color:#a67840;font-size:clamp(28px,7vw,37px);margin:12px 0 22px}.msg{font-size:clamp(17px,4.4vw,20px);line-height:1.85;margin:0;white-space:pre-line}.footer{font-size:14px;color:#a1687c;font-style:italic;margin:28px 0 0}.music{background:#a65077;color:white;border:0;border-radius:99px;padding:12px 22px;margin:22px auto 0;font:14px Arial,sans-serif;cursor:pointer;box-shadow:0 6px 18px #9a476a33}.petal{position:fixed;top:-45px;pointer-events:none;z-index:0;animation:fall linear infinite;opacity:.7;user-select:none}@keyframes fall{0%{transform:translate3d(0,-6vh,0) rotate(0)}100%{transform:translate3d(45px,112vh,0) rotate(300deg)}}@keyframes appear{from{opacity:0;transform:translateY(35px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes breathe{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.petal{display:none}}
</style>
</head>
<body>
<main>
<p class="eyebrow">A little gift for you</p>
<button id="envelope" class="env" aria-label="Chạm để mở thiệp"><span class="envFlowers">🌸🌷🌸</span></button>
<p id="hint" class="hint">💌 Chạm vào phong bì để mở thiệp</p>
<section id="card" class="card" hidden aria-live="polite">
<div class="flowerTop">🌸🌷🌸</div>
<div class="dateTitle">CHÚC MỪNG NGÀY PHỤ NỮ VIỆT NAM</div>
<h1 class="num">20 / 10</h1><div class="line"></div>
<p class="to">Thân gửi</p><h2 class="name" id="teacherName"></h2>
<p class="msg" id="teacherMessage"></p>
<p class="footer">Gửi cô những điều dịu dàng và tốt đẹp nhất ♡</p>
</section>
<button id="music" class="music" hidden aria-pressed="false">♫ Bật nhạc nhẹ nhàng</button>
</main>
<script>
'use strict';
// CHỈNH DANH SÁCH CÔ GIÁO TẠI ĐÂY
const teachers = {
  lan: {name:'Cô Lan',message:'Nhân ngày 20/10, kính chúc cô luôn xinh đẹp, hạnh phúc và thật nhiều sức khỏe. Cảm ơn cô vì đã luôn tận tâm và truyền cảm hứng cho học trò!'},
  huong: {name:'Cô Hương',message:'Chúc cô ngày 20/10 rạng rỡ, tràn đầy yêu thương và niềm vui. Mong cô luôn giữ nụ cười tươi và nhiệt huyết với nghề!'},
  trang: {name:'Cô Trang',message:'Kính chúc cô ngày 20/10 ngập tràn hạnh phúc và những bất ngờ ngọt ngào. Chúc cô luôn bình an, xinh đẹp và thành công!'}
};
const id=new URLSearchParams(location.search).get('id');
const teacher=Object.hasOwn(teachers,id)?teachers[id]:null;
const envelope=document.querySelector('#envelope'),hint=document.querySelector('#hint'),card=document.querySelector('#card'),musicBtn=document.querySelector('#music');
if(teacher){document.querySelector('#teacherName').textContent=teacher.name;document.querySelector('#teacherMessage').textContent=teacher.message;document.title='Thiệp 20/10 gửi '+teacher.name;}else{envelope.hidden=true;hint.textContent='Không tìm thấy thiệp. Vui lòng kiểm tra lại đường link.';}
envelope.addEventListener('click',()=>{envelope.hidden=true;hint.hidden=true;card.hidden=false;card.classList.add('open');musicBtn.hidden=false;});
// Hoa rơi được vẽ ngay trong trình duyệt, không cần ảnh hoặc API
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<19;i++){const petal=document.createElement('span');petal.className='petal';petal.textContent=['🌸','🌷','🌺'][i%3];petal.style.left=(i*37%101)+'%';petal.style.fontSize=(14+i%5*3)+'px';petal.style.animationDuration=(9+i%7)+'s';petal.style.animationDelay=(-(i*1.33%15))+'s';document.body.append(petal);}}
// Giai điệu tổng hợp, không cần tệp nhạc và không dùng bài hát có bản quyền
let audio,interval,playing=false,pos=0;
const melody=[261.63,329.63,392,329.63,293.66,349.23,440,349.23,329.63,392,523.25,392,293.66,349.23,261.63,0];
function note(f){if(!audio||!f)return;const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=f;gain.gain.setValueAtTime(.0001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.045,audio.currentTime+.06);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.45);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.46);}
async function stopMusic(){if(interval)clearInterval(interval);interval=null;playing=false;musicBtn.textContent='♫ Bật nhạc nhẹ nhàng';musicBtn.setAttribute('aria-pressed','false');if(audio&&audio.state==='running')await audio.suspend();}
musicBtn.addEventListener('click',async()=>{if(playing){await stopMusic();return;}try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();playing=true;musicBtn.textContent='♫ Tắt nhạc';musicBtn.setAttribute('aria-pressed','true');pos=0;note(melody[pos++]);interval=setInterval(()=>{note(melody[pos%melody.length]);pos++;},480);}catch(e){musicBtn.textContent='Thiết bị không hỗ trợ nhạc';}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)stopMusic();});
</script>
</body></html>
