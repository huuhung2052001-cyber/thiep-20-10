.picture:after{content:"";pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 42px #8c5c3f18;border-radius:10px;z-index:30}
.picture .micro-title{position:absolute;top:153px;left:0;right:0;z-index:3;text-align:center;color:#ac704f;font:11px/1.4 Arial,sans-serif;letter-spacing:3.5px;text-transform:uppercase;text-shadow:0 1px 2px #fff8f0}
.picture .micro-title:after{content:"";display:block;width:75px;height:1px;margin:12px auto 0;background:#c8a778}
/* Envelope situated on the physical stationery in the photo */
.envelope { position:absolute;top:398px;left:50%;width:326px;height:207px;transform:translateX(-50%);cursor:pointer;outline:0;z-index:5;perspective:950px;filter:drop-shadow(0 16px 17px #6e423055) }
.envelope:focus-visible{outline:3px solid #ac6948;outline-offset:7px;border-radius:8px}
.env-back{position:absolute;inset:0;border-radius:8px;background:linear-gradient(140deg,#efc3ab,#e3aa8a);border:1px solid #d3a082;box-shadow:inset 0 3px 8px #fff7e969;z-index:1}
/* Triangle back flap is behind letter when opened */
.env-flap{position:absolute;left:0;top:0;width:100%;height:130px;background:linear-gradient(180deg,#f5d7c4 0%,#e9baa0 92%);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transform:rotateX(0deg);backface-visibility:hidden;z-index:9;transition:transform .9s cubic-bezier(.22,.75,.19,1),z-index 0s .2s}
.env-face{position:absolute;inset:0;border-radius:8px;z-index:6;overflow:hidden}
.env-left{position:absolute;inset:0;background:linear-gradient(50deg,#efc9b6,#eab69d);clip-path:polygon(0 0,53% 54%,0 100%);z-index:1}
.env-right{position:absolute;inset:0;background:linear-gradient(310deg,#efd0bc,#e4ae93);clip-path:polygon(100% 0,47% 54%,100% 100%);z-index:1}
.env-bottom{position:absolute;inset:0;background:linear-gradient(170deg,#efc6ac,#dfaa8d);clip-path:polygon(0 100%,50% 41%,100% 100%);z-index:2}
.env-bottom:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff2e540,transparent)}
.env-ribbon{position:absolute;left:0;right:0;top:86px;height:35px;z-index:7;background:linear-gradient(0deg,#f7e4d29e,#fff7e698,#f4d6c29e);box-shadow:0 1px 2px #c99c7950;transition:opacity .55s}
.seal {position:absolute;left:50%;top:83px;width:47px;height:47px;transform:translateX(-50%);border-radius:50%;z-index:10;display:grid;place-items:center;
  color:#fff0d2;font-size:27px;text-shadow:0 1px 2px #946d4370;background:radial-gradient(circle at 35% 25%,#ffebc2,#d7ad6a 40%,#ae7d43 90%);border:2px solid #efd09b;box-shadow:0 4px 9px #80503570,inset 0 0 0 2px #ffffff45;transition:opacity .35s}
/* Card paper rises out when opened */
.paper{position:absolute;bottom:-2px;left:50%;transform:translate(-50%,165px) scale(.9);width:296px;min-height:422px;opacity:0;visibility:hidden;z-index:4;
  border:1px solid #d8bca1;border-radius:4px;background:linear-gradient(150deg,#fffdf8 15%,#fcf0e3 100%);box-shadow:0 11px 24px #66432a3e;
  transition:transform 1.25s cubic-bezier(.19,.82,.2,1) .16s,opacity .5s .15s,visibility 0s .16s;overflow:hidden}
.paper:before{content:"";position:absolute;inset:9px;border:1px solid #dec49f;pointer-events:none}
.paper:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 14%,#f8ebdf35 14%,#fffefa36 65%,transparent 65%)}
.paper-inner{position:relative;z-index:2;padding:27px 26px 30px;min-height:422px;display:flex;flex-direction:column;align-items:center}
.paper-ornament{width:66px;height:27px;margin-top:0;margin-bottom:9px;opacity:.78}
.small-label{font:10px/1.6 Arial,sans-serif;letter-spacing:1.5px;color:#a87b58;margin:4px 0 3px;text-transform:uppercase}
.date{font-weight:normal;color:#bd784a;font-size:48px;line-height:1.2;margin:0 0 6px;white-space:nowrap}
.rule{display:flex;align-items:center;gap:10px;color:#c49a5d;font-size:14px;margin:0 auto 10px}
.rule:before,.rule:after{content:"";width:38px;height:1px;background:#cbad81}
.dear{margin:3px 0 5px;color:#b0876e;font-size:14px;font-style:italic}
.recipient-name{color:#b0784d;font-weight:normal;font-size:25px;margin:3px 0 12px;text-align:center;line-height:1.25}
.message{font-size:14.3px;line-height:1.65;color:#775948;white-space:pre-line;text-align:center;margin:0;overflow-wrap:anywhere}
.signature{color:#b58c6f;font-style:italic;font-size:12px;line-height:1.5;margin:auto 0 0;padding-top:18px}
.paper-bottom-floral{color:#d7a377;font-size:15px;letter-spacing:6px;margin-top:4px}
/* Light fabric ribbon and gold heart on the card bottom, no text covered */
.paper-ribbon{position:absolute;bottom:22px;height:34px;width:100%;background:linear-gradient(#f2d6bb73,#ebc4a26b,#fff5e480);border-top:1px solid #fff7e4b7;border-bottom:1px solid #ffe8d3a9;z-index:3;pointer-events:none;opacity:.85}
.paper-heart{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:4;color:#c49b60;font-size:26px;text-shadow:0 2px 2px #fff6e3,0 4px 4px #aa794540;pointer-events:none}
.paper-inner{padding-bottom:81px}
/* Open state */
.picture.opened .env-flap{transform:rotateX(180deg);z-index:2}
.picture.opened .seal,.picture.opened .env-ribbon{opacity:0;pointer-events:none}
.picture.opened .paper{transform:translate(-50%,-26px) scale(1);visibility:visible;opacity:1;z-index:12}
.picture.opened .envelope{cursor:default;filter:none}
.instruction{font:14px/1.5 Arial,sans-serif;color:#805f4b;text-align:center;margin:0 0 2px}
.actions{min-height:40px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
button.action{border:1px solid #d7af8e;border-radius:40px;background:#fff7eb;color:#94674d;padding:10px 17px;font:13px Arial,sans-serif;cursor:pointer;box-shadow:0 3px 10px #7953391e}
button.action:hover{background:#f9e6d1}
button.action:focus-visible{outline:2px solid #9d5c41;outline-offset:3px}
[hidden]{display:none!important}
.petal{position:absolute;z-index:4;top:-28px;width:13px;height:19px;border-radius:75% 0 75% 20%;background:linear-gradient(140deg,#f7d1ad,#e69c75);opacity:.82;pointer-events:none;box-shadow:0 0 4px #f7d5b2;animation:petal-fall linear infinite;transform-origin:center}
@keyframes petal-fall{0%{transform:translate3d(0,-10px,0) rotate(0);opacity:0}15%{opacity:.83}100%{transform:translate3d(52px,780px,0) rotate(440deg);opacity:0}}
@media(max-width:480px){main{padding:8px 6px 20px;gap:12px}.picture{width:min(100%,395px);height:690px;border-width:4px;border-radius:11px}.picture .micro-title{top:143px;font-size:9px;letter-spacing:2.8px}
  .envelope{top:375px;width:min(82vw,294px);height:195px}.env-flap{height:118px}.env-ribbon{top:83px}.seal{top:79px}.paper{width:min(80vw,272px);min-height:405px}.paper-inner{min-height:405px;padding:24px 19px 81px}.date{font-size:44px}.recipient-name{font-size:25px}.message{font-size:13.4px;line-height:1.57}.picture.opened .paper{transform:translate(-50%,-35px) scale(1)}.small-label{font-size:9px}}
@media(max-width:355px){.picture{height:670px}.envelope{top:365px;width:275px}.paper{width:258px}.message{font-size:12.8px}.paper-inner{padding-left:15px;padding-right:15px}.date{font-size:41px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.petal{display:none}}
</style>

const wishes = [
  "Nhân ngày 20/10, chúc em luôn rạng rỡ, tự tin và thật nhiều niềm vui. Mong những ước mơ của em dần thành hiện thực!",
  "Chúc em một ngày 20/10 ngập tràn yêu thương, nhận được những lời chúc ngọt ngào và luôn mỉm cười thật tươi!",
  "Mong em luôn giữ được sự nhiệt huyết, lòng ham học hỏi và bản lĩnh để chinh phục những mục tiêu mà mình lựa chọn.",
  "Chúc em có một thanh xuân đáng nhớ, thật nhiều bạn tốt, những bài học thú vị và những kỷ niệm đẹp mỗi ngày.",
  "Ngày 20/10, chúc em luôn yêu thương bản thân, tự hào về những tiến bộ nhỏ và mạnh dạn bước tới những điều mới mẻ.",
  "Chúc em luôn tỏa sáng theo cách riêng của mình: dịu dàng khi muốn, mạnh mẽ khi cần và hạnh phúc mỗi ngày!",
  "Mong mỗi ngày đến lớp đều mang đến cho em niềm vui, kiến thức mới và động lực để tiến gần hơn tới ước mơ.",
  "Nhân ngày Phụ nữ Việt Nam, chúc em thật nhiều may mắn, bình an và luôn được trân trọng bởi những người yêu thương em.",
  "Chúc em ngày 20/10 ngọt ngào như một đóa hoa. Hãy luôn tin vào chính mình và tận hưởng tuổi trẻ thật rực rỡ!",
  "Gửi em một chút nắng ấm của tháng Mười. Chúc em học tập tốt, vui vẻ, tự tin và gặp thật nhiều điều đáng yêu!"
];

// ====== DANH SÁCH TÊN MẪU: ĐỔI THÀNH TÊN HỌC VIÊN CỦA BẠN ======
// Ví dụ ?id=linh, ?id=huong hoặc ?id=mai
// Hoặc dùng ngay ?name=Ngọc%20Anh mà không cần thêm vào danh sách.
const students = {
  linh: "Linh",
  huong: "Hương",
  mai: "Mai"
};

// Nếu không có tên/id, hiển thị thiệp chung cho các bạn nữ.
const params = new URLSearchParams(window.location.search);
const id = (params.get("id") || "").trim().toLowerCase();
const customName = (params.get("name") || "").trim().slice(0, 45);
const recipientName = customName || students[id] || "Cô gái tuyệt vời";
const picture = document.getElementById("picture");
const envelope = document.getElementById("envelope");
const instruction = document.getElementById("instruction");
const closeBtn = document.getElementById("closeBtn");
const wishText = document.getElementById("wishMessage");

document.getElementById("recipientName").textContent = recipientName;
document.title = "20/10 | Gửi " + recipientName;

let currentWish = -1;
function randomWish() {
  // Không chọn lại ngay câu vừa hiển thị khi có hơn một câu.
  let next = Math.floor(Math.random() * wishes.length);
  if (wishes.length > 1 && next === currentWish) {
    next = (next + 1 + Math.floor(Math.random() * (wishes.length - 1))) % wishes.length;
  }
  currentWish = next;
  wishText.textContent = wishes[next];
}
randomWish();

function openCard(){
  if (picture.classList.contains("opened")) return;
  picture.classList.add("opened");
  envelope.setAttribute("aria-label","Thiệp đã mở");
  closeBtn.hidden = false;
  instruction.textContent = "Chúc em một ngày 20/10 thật rạng rỡ ♡";
  startMusic(); // Phát nhạc ngay khi chạm để mở phong bì
}
function closeCard(){
  picture.classList.remove("opened");
  envelope.setAttribute("aria-label","Chạm để mở thiệp 20 tháng 10");
  closeBtn.hidden = true;
  instruction.textContent = "✉ Chạm vào dấu sáp để nhận lời chúc 20/10";
  stopMusic();
}
envelope.addEventListener("click",openCard);
envelope.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openCard();}});
closeBtn.addEventListener("click",closeCard);
// Petals are generated locally; no AI or external API is called.
if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  for(let i=0;i<14;i++){
    const p=document.createElement("span");p.className="petal";
    p.style.left=((i*29+9)%100)+"%";p.style.animationDuration=(10+(i%6)*2)+"s";p.style.animationDelay=(-i*1.9)+"s";p.style.width=(8+i%4*3)+"px";
    p.style.height=(12+i%4*4)+"px";picture.appendChild(p);
  }
}
// Simple optional Web Audio music (generated on the device, no MP3 fee).
let audioCtx=null,musicTimer=null,playing=false,noteIndex=0;
const melody=[392,440,523.25,440,392,349.23,392,329.63,349.23,392,440,392,329.63,293.66,329.63,0];
function note(freq){
  if(!audioCtx||!freq)return;
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type="sine";osc.frequency.value=freq;
  gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.037,audioCtx.currentTime+.06);
  gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.47);
  osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.48);
}
// Trình duyệt cho phép âm thanh sau tương tác của người dùng (mở phong bì).
// Không cần nút bật/tắt nhạc. Khi đóng thiệp hoặc đổi tab, nhạc dừng.
function startMusic(){
  if(playing) return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    if(!audioCtx) audioCtx=new Ctx();
    playing=true;
    noteIndex=0;
    // Được gọi ngay trong thao tác nhấn phong bì (user gesture).
    Promise.resolve(audioCtx.resume()).then(()=>{
      if(!playing) return;
      note(melody[noteIndex++]);
      musicTimer=setInterval(()=>{note(melody[(noteIndex++)%melody.length]);},520);
    }).catch(()=>{playing=false;});
  }catch(e){playing=false;}
}
function stopMusic(){
  if(musicTimer!==null) clearInterval(musicTimer);
  musicTimer=null;
  playing=false;
  if(audioCtx&&audioCtx.state==="running")audioCtx.suspend().catch(()=>{});
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&playing)stopMusic();});
</script>
